services:
  - type: web
    name: samati-focus-pet
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: samati-db
          property: connectionString
databases:
  - name: samati-db
    plan: free
    region: singapore
    databaseName: samati
    user: samati
    ipAllowList: []
